# STEPSS scenario. Save configuration wrote this; Load configuration reads it.
# Paths inside this file's own directory are stored relative to it, so the
# folder can be moved or copied whole. Everything else is absolute.
# Scenario: WAMCES Continental European model, full plant, 20 s without disturbance.
# license.dat holds the $LICENSE record. It is git-ignored: create it beside this file.

stepss.format = 1

# System data
data.1 = wamces_lf.dat
data.2 = wamces_lfres.dat
data.3 = wamces_dyn.dat
data.4 = wamces_settings.dat
data.5 = license.dat
disturbance = wamces_flat.dst
diagram = 

# Observables
observables.file = wamces_obs.dat
runtime.1.type = Machine Speed
runtime.1.name = G2178
runtime.2.type = Machine Speed
runtime.2.name = G3264
runtime.3.type = 
runtime.3.name = 

# Recording
record.trajectory = true
record.continuous = false
record.discrete = true
record.init = true
